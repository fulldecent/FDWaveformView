name: ci

# macos-latest is the macOS 26 image. It does not install Xcode 16.4, and the
# simulator-discovery script previously used here failed on that image
# (https://github.com/fulldecent/FDWaveformView/actions/runs/25414955912).
# This job pins the macOS 15 image, whose default Xcode is 16.4 and which
# lists an iPhone 16 simulator on iOS 18.5:
# https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Show build environment
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Build
        run: |
          xcodebuild build \
            -scheme FDWaveformView \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'

      - name: Check formatting
        run: |
          swift format format --in-place --recursive Sources/ Tests/
          git diff --exit-code || (echo "Code is not formatted. Run: swift format format --in-place --recursive Sources/ Tests/" && exit 1)

      - name: Test
        run: |
          xcodebuild test \
            -scheme FDWaveformView \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
