name: ci

# GitHub-hosted Xcode 27. macos-26 stops at Xcode 26, which cannot load
# swift-tools-version 6.4.
# https://github.blog/changelog/2026-07-16-xcode-27-runner-image-now-in-public-preview/
# https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
#
# swift6-module-template runs `xcrun swift test` on this runner. This package
# imports UIKit and its platforms are iOS and visionOS, so that command builds
# for macOS and cannot compile. The destination below is the iPhone 17
# simulator on iOS 27.0, which the Xcode 27.0 image lists.
#
# release.yml calls this workflow. It reads $.jobs.build-test.

on:
  workflow_call:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: xcode-27
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Show build environment
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Check formatting
        run: |
          swift format format --in-place --recursive Sources/ Tests/
          git diff --exit-code || (echo "Code is not formatted. Run: swift format format --in-place --recursive Sources/ Tests/" && exit 1)

      - name: Test
        run: |
          xcodebuild test \
            -scheme FDWaveformView \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0'
